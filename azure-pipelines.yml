
trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

- task: NodeTool@0
  displayName: 'Install Node.js'
  inputs:
    versionSpec: '20.x'

- script: npm install
  displayName: 'Install Dependencies'

- script: npm test
  displayName: 'Run Tests'

- script: npm start
  displayName: 'Run Application'
